services:
  core:
    build:
      context: ./core
    container_name: asic-control-core
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      - ./miners.json:/app/miners.json:ro
      - ./pools.json:/app/pools.json
      - ./data:/app/data
    ports:
      - "8486:8486"
    restart: unless-stopped
